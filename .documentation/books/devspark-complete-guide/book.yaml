title: "Developing with DevSpark: The Complete Guide"
subtitle: "Specification-Driven AI Development from First Principles to Production"
author: "Mark Hazleton"
version: "1.0"
description: >
  The definitive guide to DevSpark — the open-source framework that brings
  constitution-powered governance, specification-driven workflows, and structured
  quality gates to any AI coding assistant. Weaves a 40-year arc of code generation
  history through four real production specifications on a live NuGet package,
  covering every command, every architectural choice, and every hard-won lesson
  from months of daily use. For solo developers and teams who want AI-assisted
  development to be repeatable, auditable, and consistently high-quality.
language: "en"
cover_image: "books/devspark-complete-guide/cover.png"

