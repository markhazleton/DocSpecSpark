[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "docspark-cli"
version = "0.1.0"
description = "DocSpark CLI for installing a document AI workflow derived from DevSpark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "typer>=0.16.0",
]

[project.scripts]
docspark = "docspark_cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docspark_cli"]