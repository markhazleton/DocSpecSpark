[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "docspecspark"
version = "0.3.0"
description = "DocSpecSpark source repository and CLI bootstrap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=4.0,<5",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "typer>=0.16.0",
]

[project.scripts]
docspec = "docspec_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=7.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docspec_cli"]